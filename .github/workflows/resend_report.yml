name: Resend saved monitor report

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed monitor run containing the exact saved report"
        required: true
        type: string
      recipient:
        description: "Recipient for this resend only"
        required: true
        type: string
      subject:
        description: "Original email subject"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download original report
        uses: actions/download-artifact@v7
        with:
          name: us-kospi-drop-report-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: saved-report
      - name: Send one unchanged report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ORIGINAL_SUBJECT: ${{ inputs.subject }}
        run: |
          python - <<'PY'
          import json
          import logging
          import os
          from pathlib import Path
          from notifier import send_gmail_email
          from saved_report import validate_saved_report

          logging.basicConfig(level=logging.INFO)
          # The recipient comes from the event payload, not from env: or an expression, so it is not printed in the log.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              recipient = str(json.load(handle)["inputs"]["recipient"]).strip()
          print("::add-mask::" + recipient)
          os.environ["ALERT_EMAIL_RECIPIENT"] = recipient
          reports = list(Path("saved-report").glob("combined-*.md"))
          if len(reports) != 1:
              raise RuntimeError("Expected exactly one saved report; refusing ambiguous resend")
          plain = reports[0].read_text(encoding="utf-8")
          html = reports[0].with_suffix(".html").read_text(encoding="utf-8")
          validate_saved_report(reports[0].with_suffix(".json"), plain, html, os.environ["ORIGINAL_SUBJECT"])
          send_gmail_email(plain, os.environ["ORIGINAL_SUBJECT"], html)
          PY
