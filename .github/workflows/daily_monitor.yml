name: S&P 500 Daily Drop Monitor

on:
  schedule:
    # 03:07 UTC Tuesday-Saturday = 12:07 KST. This is at least six hours after
    # the US regular close year-round, allowing Yahoo daily bars to settle.
    # A non-zero minute avoids GitHub Actions' documented top-of-hour peak.
    - cron: "7 3 * * 2-6"
  workflow_dispatch:
    inputs:
      session_date:
        description: "Optional US session date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sp500-drop-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run monitor
        shell: bash
        run: |
          args=(--notify)
          if [[ -n "${{ inputs.session_date }}" ]]; then
            args+=(--session-date "${{ inputs.session_date }}")
          fi
          python main.py "${args[@]}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500-drop-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 90
