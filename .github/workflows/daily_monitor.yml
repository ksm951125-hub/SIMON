name: US + KOSPI Daily Drop Monitor

on:
  schedule:
    # 23:00 UTC Monday-Friday = 08:00 KST Tuesday-Saturday.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      session_date_us:
        description: "Optional US session date (YYYY-MM-DD)"
        required: false
        type: string
      session_date_kr:
        description: "Optional KOSPI session date (YYYY-MM-DD)"
        required: false
        type: string
      send_email:
        description: "Send the combined Gmail notification"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sp500-drop-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run monitor
        shell: bash
        run: |
          args=()
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.send_email }}" == "true" ]]; then
            args+=(--notify)
          else
            args+=(--dry-run)
          fi
          if [[ -n "${{ inputs.session_date_us }}" ]]; then
            args+=(--session-date-us "${{ inputs.session_date_us }}")
          fi
          if [[ -n "${{ inputs.session_date_kr }}" ]]; then
            args+=(--session-date-kr "${{ inputs.session_date_kr }}")
          fi
          python main.py "${args[@]}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-kospi-drop-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 90
